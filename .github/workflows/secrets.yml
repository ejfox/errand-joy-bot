name: secrets
# Full-history secret scan on every push and pull request. Required check: a red X here
# means a commit carries something that looks like a key. Revoke it first, then rewrite.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          v=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .
      - name: Forbidden files
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)config\.toml$|\.db($|-)|(^|/)data/|\.pem$|\.key$|id_(rsa|ed25519|ecdsa)' | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
